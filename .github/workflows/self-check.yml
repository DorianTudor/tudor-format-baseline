name: Self-check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: A tag matches the version the workflow compares against
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared=$(sed -n 's/^  BASELINE_VERSION: //p' .github/workflows/prettier-baseline.yml)
          if [ "$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but prettier-baseline.yml declares BASELINE_VERSION $declared"
            exit 1
          fi

      - name: The README names the current version
        run: |
          declared=$(sed -n 's/^  BASELINE_VERSION: //p' .github/workflows/prettier-baseline.yml)
          grep -qF "Current version: \`$declared\`" README.md || { echo "::error::README.md does not name $declared as the current version"; exit 1; }

      - name: This repository is formatted with its own baseline
        run: |
          version=$(sed -n 's/^  PRETTIER_VERSION: //p' .github/workflows/prettier-baseline.yml)
          npx --yes "prettier@$version" --check .

  # why: the reusable workflow fetches the canonical files at its own tag, which exists only once the tag is pushed.
  reusable-workflow-on-itself:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/prettier-baseline.yml
    with:
      mode: docs-only
